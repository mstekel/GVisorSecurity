replicaCount: 1

image:
  repository: my-simple-gvisor
  tag: "v1.0"
  pullPolicy: IfNotPresent

# Set to "gvisor" to run the pod under the gVisor (runsc) sandboxed runtime,
# assuming a matching RuntimeClass named "gvisor" is already installed on the
# cluster. Leave empty ("") to use the default container runtime.
runtimeClassName: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources: {}
#  limits:
#    cpu: 200m
#    memory: 256Mi
#  requests:
#    cpu: 100m
#    memory: 128Mi

nameOverride: ""
fullnameOverride: ""