replicaCount: 1

image:
  repository: my-simple-gvisor
  tag: "v1.0"
  pullPolicy: IfNotPresent

# Set to "gvisor" to run the pod under the gVisor (runsc) sandboxed runtime,
# assuming a matching RuntimeClass named "gvisor" is already installed on the
# cluster. Leave empty ("") to use the default container runtime.
runtimeClassName: ""

# The image's default command is just an interactive shell (/bin/sh -l),
# which exits immediately when run non-interactively. Override it here to
# keep the container alive so you can `kubectl exec -it <pod> -- /bin/sh`
# into it (e.g. for probing gVisor/runsc sandbox behavior).
command:
  - /bin/sh
  - -c
  - "while true; do sleep 3600; done"

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Pod-level security hardening (applies to all containers in the pod).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

# Container-level security hardening.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# This pod never talks to the Kubernetes API, so don't hand it a token.
automountServiceAccountToken: false

# Scratch space, since readOnlyRootFilesystem above means the container's
# own filesystem can't be written to (e.g. if you `kubectl exec` in to poke
# around and need to write a file, use /tmp).
tmpVolume:
  enabled: true
  sizeLimit: 64Mi

nameOverride: ""
fullnameOverride: ""