replicaCount: 1

image:
  repository: my-simple-gvisor
  tag: "v1.0"
  pullPolicy: IfNotPresent

# Set to "gvisor" to run the pod under the gVisor (runsc) sandboxed runtime,
# assuming a matching RuntimeClass named "gvisor" is already installed on the
# cluster. Leave empty ("") to use the default container runtime.
runtimeClassName: ""

# The image's default command is just an interactive shell (/bin/sh -l),
# which exits immediately when run non-interactively. Override it here to
# keep the container alive so you can `kubectl exec -it <pod> -- /bin/sh`
# into it (e.g. for probing gVisor/runsc sandbox behavior).
command:
  - /bin/sh
  - -c
  - "while true; do sleep 3600; done"

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Pod-level security hardening (applies to all containers in the pod).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

# Container-level security hardening.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# This pod never talks to the Kubernetes API, so don't hand it a token.
automountServiceAccountToken: false

# Scratch space, since readOnlyRootFilesystem above means the container's
# own filesystem can't be written to (e.g. if you `kubectl exec` in to poke
# around and need to write a file, use /tmp).
tmpVolume:
  enabled: true
  sizeLimit: 64Mi

# Custom seccomp profile that additionally allows the syscalls gVisor
# (runsc) needs to run rootless sandboxing inside this container: ptrace,
# unshare, clone, clone3, pivot_root, mount, umount2. Everything else stays
# restricted to the same Docker/Moby default (RuntimeDefault-equivalent)
# baseline. The profile is delivered via a ConfigMap ("data:") and copied
# onto the node by an initContainer, rather than requiring a physical file
# pre-placed on every node's disk. See templates/seccomp-configmap.yaml.
#
# This is deliberately capability-free: Docker's default seccomp profile
# blocks unshare() outright and gates clone()'s namespace flags behind
# CAP_SYS_ADMIN, which is stricter than the kernel itself requires. The
# kernel lets an unprivileged process create a new user namespace (and,
# combined in the same call, other namespaces) via unshare(CLONE_NEWUSER)
# with no capabilities at all, and grants it a full capability set scoped
# to that new namespace - which is what actually makes mount/pivot_root
# work inside it. This rule just removes Docker's extra seccomp-level
# restriction; it intentionally does not, and should not, need
# securityContext.capabilities.add: [SYS_ADMIN] or any other capability.
seccomp:
  enabled: true
  profileFileName: my-simple-gvisor-runsc.json

nameOverride: ""
fullnameOverride: ""