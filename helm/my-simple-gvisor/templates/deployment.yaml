apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "my-simple-gvisor.fullname" . }}
  labels:
    {{- include "my-simple-gvisor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "my-simple-gvisor.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "my-simple-gvisor.labels" . | nindent 8 }}
    spec:
      {{- if .Values.runtimeClassName }}
      runtimeClassName: {{ .Values.runtimeClassName }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.seccomp.enabled }}
      # Stages the custom seccomp profile (from the ConfigMap's "data:") onto
      # this node's kubelet seccomp root before the main container starts.
      # Runs on whichever node this pod lands on, so it's correct even in a
      # multi-node cluster without needing a cluster-wide DaemonSet.
      initContainers:
        - name: seccomp-profile-installer
          image: busybox:stable
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /host-seccomp/profiles
              cp /profile/{{ .Values.seccomp.profileFileName }} /host-seccomp/profiles/{{ .Values.seccomp.profileFileName }}
          # Pod-level securityContext (runAsUser 65534) would block writing
          # to the root-owned /var/lib/kubelet/seccomp on the node. This is
          # a short-lived, one-shot setup step (not the sandboxed workload),
          # so it gets its own root override rather than weakening the main
          # container's hardening.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
          volumeMounts:
            - name: node-seccomp-root
              mountPath: /host-seccomp
            - name: seccomp-profile
              mountPath: /profile
              readOnly: true
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.command }}
          command:
            {{- toYaml .Values.command | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
            {{- if .Values.seccomp.enabled }}
            seccompProfile:
              type: Localhost
              localhostProfile: profiles/{{ .Values.seccomp.profileFileName }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.tmpVolume.enabled }}
          volumeMounts:
            {{- if .Values.tmpVolume.enabled }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
          {{- end }}
      {{- if or .Values.tmpVolume.enabled .Values.seccomp.enabled }}
      volumes:
        {{- if .Values.tmpVolume.enabled }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpVolume.sizeLimit }}
        {{- end }}
        {{- if .Values.seccomp.enabled }}
        - name: node-seccomp-root
          hostPath:
            path: /var/lib/kubelet/seccomp
            type: DirectoryOrCreate
        - name: seccomp-profile
          configMap:
            name: {{ include "my-simple-gvisor.fullname" . }}-seccomp
        {{- end }}
      {{- end }}